[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "systor"
version = "1.1.0"
description = "Lightweight Linux system monitor with web dashboard, sustained-threshold alerts, and Telegram/Discord notifications."
readme = "README.md"
authors = [
    { name = "Dr. Sagar (SeaXen)", email = "drsea@drhrs.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "Flask>=3.0",
    "waitress>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "playwright>=1.40",
    "Pillow>=10.0",
]

[project.scripts]
systor = "systor.cli:main"

[project.urls]
Homepage = "https://github.com/SeaXen/systor"
Repository = "https://github.com/SeaXen/systor"
Issues = "https://github.com/SeaXen/systor/issues"

[tool.setuptools.packages.find]
exclude = ["tests*", "tools*"]

[tool.setuptools.package-data]
systor = [
    "templates/*.html",
    "static/css/*.css",
    "static/js/*.js",
    "static/img/*",
    "static/*.json",
    "static/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
