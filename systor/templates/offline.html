{% extends "base.html" %}
{% block title %}Offline — systor{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;margin:3rem auto;text-align:center;padding:2.5rem 1.5rem;">
  <div style="font-size:3rem;margin-bottom:1rem;color:var(--text-muted);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="32" height="32" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19 5a10 10 0 0 1 0 14M5 19a10 10 0 0 1 0-14"/></svg></div>
  <h2 style="margin:0 0 0.5rem;">Connection Unavailable</h2>
  <p style="color:var(--text-muted);margin-bottom:1.5rem;font-size:0.95rem;">
    Systor cannot reach the server right now. Live system telemetry and actions are paused while offline.
  </p>
  <button type="button" class="btn btn-primary" onclick="window.location.reload()">Retry Connection</button>
</div>
{% endblock %}
