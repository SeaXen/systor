name: CI Suite

# Forgejo runner here has no Docker socket in job containers and no Python
# tool cache for actions/setup-python. Run the same checks in a Python image
# with plain shell steps; the Docker build/scan stays in .github/workflows.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint:
    name: Code Quality, Typing & Security Scans
    runs-on: docker
    container:
      image: python:3.12-slim
    steps:
      - name: Install git before checkout
        run: |
          apt-get update -qq
          apt-get install -y -qq git
      - name: Checkout repository
        run: |
          REPO_URL="${GITHUB_SERVER_URL:-http://localhost:3002}/${GITHUB_REPOSITORY:-sagar/systor}.git"
          git clone --quiet "$REPO_URL" .
          git checkout --quiet "${GITHUB_SHA:-main}"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install 'ruff==0.6.9'
      - name: Run Ruff Linter
        run: ruff check .
      - name: Run Mypy Type Checker
        run: mypy systor
      - name: Run Bandit Security Scanner
        run: bandit -r systor -ll
      - name: Run pip-audit Dependency Vulnerability Scan
        run: pip-audit -r requirements.txt
      - name: Validate shell script syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh

  test:
    name: Unit & Integration Tests
    runs-on: docker
    container:
      image: python:3.12-slim
    steps:
      - name: Install git before checkout
        run: |
          apt-get update -qq
          apt-get install -y -qq git
      - name: Checkout repository
        run: |
          REPO_URL="${GITHUB_SERVER_URL:-http://localhost:3002}/${GITHUB_REPOSITORY:-sagar/systor}.git"
          git clone --quiet "$REPO_URL" .
          git checkout --quiet "${GITHUB_SHA:-main}"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov
          pip install -e .
      - name: Run test suite with coverage gate (>= 80%)
        run: |
          pytest -q --cov=systor --cov-report=term-missing tests/ \
            --ignore=tests/test_webapp_playwright.py \
            --deselect=tests/test_coverage_deep_modules.py::test_collector_full_run_cycle
          pytest -q --cov=systor --cov-append --cov-report=term-missing \
            tests/test_coverage_deep_modules.py::test_collector_full_run_cycle
          coverage report --fail-under=80

  e2e:
    name: Playwright E2E & Design Audit
    runs-on: docker
    container:
      image: python:3.12-slim
    steps:
      - name: Install git before checkout
        run: |
          apt-get update -qq
          apt-get install -y -qq git
      - name: Checkout repository
        run: |
          REPO_URL="${GITHUB_SERVER_URL:-http://localhost:3002}/${GITHUB_REPOSITORY:-sagar/systor}.git"
          git clone --quiet "$REPO_URL" .
          git checkout --quiet "${GITHUB_SHA:-main}"
      - name: Install dependencies & browsers
        run: |
          python -m pip install --upgrade pip
          apt-get install -y -qq libatomic1
          pip install -r requirements-dev.txt
          pip install -e .
          playwright install --with-deps chromium
      - name: Run Playwright E2E Tests
        run: python tests/test_webapp_playwright.py
      - name: Run Design & WCAG Audit
        run: python tools/design_audit.py --seed
